name: Validate
on:
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: Source / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24.21.0', '26.9.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=low
        if: matrix.node == '26.9.0'
      - run: npm run package:pack
        if: matrix.node == '26.9.0'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node == '26.9.0'
        with:
          name: npm-package
          path: .artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  consumers:
    name: Package / ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.18.0', '24.21.0', '26.9.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: .artifacts
      - run: node scripts/verify-package.mjs --tarball .artifacts/*.tgz
  required:
    name: Required checks
    if: always()
    needs: [checks, consumers]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all validation jobs
        env:
          SOURCE_RESULT: ${{ needs.checks.result }}
          CONSUMER_RESULT: ${{ needs.consumers.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$CONSUMER_RESULT" = success
